name: AgentLens Eval CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  eval:
    name: Run Evaluation Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq python-dotenv fastapi uvicorn sqlalchemy httpx

      - name: Run AgentLens eval suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python tests/ci_eval.py

      - name: Upload CI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentlens-ci-report
          path: tests/ci_report.json

      - name: Post CI summary
        if: always()
        run: |
          if [ -f tests/ci_report.json ]; then
            echo "## AgentLens CI Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            python3 - << 'PYEOF'
          import json
          with open("tests/ci_report.json") as f:
              r = json.load(f)
          status = "✅ PASSED" if r["status"] == "PASS" else "❌ FAILED"
          print(f"### {status}")
          print(f"| Metric | Value |")
          print(f"|--------|-------|")
          print(f"| Tests Run | {r['total']} |")
          print(f"| Passed | {r['passed']} |")
          print(f"| Failed | {r['failed']} |")
          print(f"| Avg Score | {r['avg_score']} |")
          if r['failures']:
              print(f"\n### Failed Tests")
              for f in r['failures']:
                  print(f"- `{f['query'][:60]}` — score: {f['score']} (min: {f['min_score']})")
          PYEOF
          fi
