name: AgentLens Eval CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install groq python-dotenv fastapi uvicorn \
                      sqlalchemy httpx pytest pytest-cov \
                      sentence-transformers faiss-cpu hdbscan \
                      scikit-learn numpy
      - name: Run unit tests
        run: |
          python -m pytest tests/test_rules.py \
                           tests/test_regression.py \
                           tests/test_tracer.py \
                           -v --tb=short
      - name: Post test summary
        if: always()
        run: |
          echo "## Unit Test Results" >> $GITHUB_STEP_SUMMARY
          python -m pytest tests/test_rules.py \
                           tests/test_regression.py \
                           tests/test_tracer.py \
                           --tb=no -q 2>&1 | tail -5 >> $GITHUB_STEP_SUMMARY

  eval:
    name: LLM Eval Suite
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install groq python-dotenv fastapi uvicorn \
                      sqlalchemy httpx
      - name: Run AgentLens eval suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python tests/ci_eval.py
      - name: Upload CI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentlens-ci-report
          path: tests/ci_report.json
      - name: Post eval summary
        if: always()
        run: |
          if [ -f tests/ci_report.json ]; then
            echo "## AgentLens Eval Report" >> $GITHUB_STEP_SUMMARY
            python3 - << 'PYEOF'
          import json
          with open("tests/ci_report.json") as f:
              r = json.load(f)
          status = "✅ PASSED" if r["status"] == "PASS" else "❌ FAILED"
          print(f"### {status}")
          print(f"| Metric | Value |")
          print(f"|--------|-------|")
          print(f"| Tests Run | {r['total']} |")
          print(f"| Passed | {r['passed']} |")
          print(f"| Failed | {r['failed']} |")
          print(f"| Avg Score | {r['avg_score']} |")
          if r['failures']:
              print(f"\n### Failed Tests")
              for f in r['failures']:
                  print(f"- `{f['query'][:60]}` — score: {f['score']}")
          PYEOF
          fi
